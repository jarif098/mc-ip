name: Discord Push Notification

on:
  push:
    branches:
      - '**'

jobs:
  discord-message:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send Discord Embed Notification
        run: |
          # Read ip.json values
          VERSION=$(jq -r '.version' ip.json)
          DOWNLOAD=$(jq -r '.push' ip.json)
          CHANGELOGS=$(jq -r '.changelogs' ip.json)

          # Build and send Discord Embed payload
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$(jq -n \
                 --arg title "Launcher got a new update!" \
                 --arg repo "$GITHUB_REPOSITORY" \
                 --arg branch "$GITHUB_REF_NAME" \
                 --arg author "$GITHUB_ACTOR" \
                 --arg version "$VERSION" \
                 --arg download "$DOWNLOAD" \
                 --arg changelogs "$CHANGELOGS" \
                 --arg commit "${{ github.event.head_commit.message }}" \
                 --arg url "${{ github.event.head_commit.url }}" \
                 '{
                   embeds: [{
                     title: $title,
                     url: $url,
                     color: 65280,
                     description: ("**Repository:** [" + $repo + "](https://github.com/" + $repo + ")\n**Branch:** `" + $branch + "`\n**Author:** " + $author + "\n\n**Version:** `" + $version + "`\n\n**Download:**\n[Download Launcher](" + $download + ")\n\n**Changelogs:**\n> " + $changelogs + "\n\n**Latest Commit Message:**\n> " + $commit),
                     timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
                   }]
                 }')" \
               "${{ secrets.DISCORD_WEBHOOK }}"
